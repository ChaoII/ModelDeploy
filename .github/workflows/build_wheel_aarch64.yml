name: Wheel aarch64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheel-aarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== aarch64 wheel ====================
  # 之前跑在 ubuntu-latest + QEMU 上（模拟执行 aarch64 构建环境），实测每次都撞 6 小时
  # job 上限被取消，从未产出过 wheel。现改为 GitHub 的 arm64 托管 runner 原生执行：
  # cibuildwheel 仍在 manylinux_2_28_aarch64 容器内构建（保证 glibc 2.28 兼容），
  # 但容器是 arm64 原生运行，无需 QEMU。
  build:
    name: wheels (manylinux2.28-aarch64 / cp312-cp313)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          uname -m
          docker --version

      - name: Build aarch64 wheels
        # 须 cibuildwheel >= v2.22.0：v2.21.x 在 before_all 硬编码容器基础 python
        # 为 /opt/python/cp38-cp38，而新版 manylinux_2_28_aarch64 镜像已移除 cp38
        # （实测 2026.09.05-1 默认 python3=3.12，/opt/python 仅 cp39+），导致
        # before_all 首行 `No such file or directory` (code 127)。v2.22.0 起改用 cp39。
        uses: pypa/cibuildwheel@v2.23.4
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: aarch64
          CIBW_BUILD: "cp312-* cp313-*"
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.12"
          # manylinux2014 基础镜像 GCC 4.8 < 10.3，无法为 cp312/cp313 源码编 numpy 2.x
          # （aarch64 亦无 manylinux2014 的 numpy 预编译轮）→ 改用 manylinux_2_28（glibc≥2.28，
          # GCC 新，numpy/onnxruntime/opencv 均有预编译轮）。wheel 平台标签变为 manylinux_2_28_aarch64。
          CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/manylinux_2_28_aarch64:2026.09.05-1
          # 仓库要求 CMake >= 3.27；为每个 cp3xx 构建环境装一份 pip cmake，避免镜像自带版本过旧
          CIBW_BEFORE_BUILD_LINUX: >-
            python -m pip install --no-cache-dir "cmake==3.31.6"
          CIBW_BEFORE_ALL_LINUX: >-
            (yum install -y openssl-devel || dnf install -y openssl-devel) || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64-manylinux2.28
          path: dist/*.whl
          retention-days: 7
