[build-system]
requires = ["scikit-build-core", "pybind11", "ninja", "numpy", "pybind11-stubgen"]
build-backend = "scikit_build_core.build"

[project]
name = "modeldeploy"
version = "2.7.0"
description = "ModelDeploy with C++ inference and pybind11 bindings"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Aichao", email = "849453582@qq.com" }]

[project.scripts]
md-person-label = "modeldeploy.tools.person_label:main"

[project.optional-dependencies]
label = ["opencv-python"]

[tool.scikit-build]
cmake.version = ">=3.15"
# scikit-build-core 用的是多配置生成器里面如果使用了CMAKE_BUILD_TYPE变量会接收不到
cmake.build-type = "Release"
cmake.define.CMAKE_BUILD_TYPE = "Release"
cmake.define.WITH_GPU = { env = "WITH_GPU", default = "OFF" }
cmake.define.ENABLE_ORT = { env = "ENABLE_ORT", default = "ON" }
cmake.define.ENABLE_MNN = { env = "ENABLE_MNN", default = "OFF" }
cmake.define.ENABLE_TRT = { env = "ENABLE_TRT", default = "OFF" }
cmake.define.TRT_DIR = { env = "TRT_DIR", default = "" }
cmake.define.BUILD_PYTHON = "ON"
cmake.define.BUILD_CAPI = "OFF"
cmake.define.BUILD_EXAMPLES = "OFF"
cmake.define.BUILD_TESTS = "OFF"
cmake.define.BUILD_VISION = "ON"
cmake.define.BUILD_AUDIO = "ON"
cmake.define.BUILD_BARCODE = "ON"
cmake.define.BUILD_NLP = "ON"
cmake.define.BUILD_VIDEO = "OFF"
cmake.define.ENABLE_WETEXT = "OFF"
cmake.define.BUILD_ENCRYPTION = { env = "BUILD_ENCRYPTION", default = "OFF" }
cmake.args = ["-G", "Ninja"]

wheel.packages = ["python/modeldeploy"]
# 收敛空间：仅打包 modeldeploy/。
# kaldi-native-fbank、zxing 等第三方子工程的 install() 无法在 CMake 层面关闭，
# 会把静态库/头文件/CMake config 装到 wheel 顶层；这里按顶层目录排除掉，
# 只保留 Python 包真正需要的 modeldeploy/。这些模式按 fnmatch 相对 wheel 根匹配，
# "lib/*" 只命中顶层 lib/，不会误伤 modeldeploy/ 内的文件。
wheel.exclude = [
    "include/*",
    "lib/*",
    "share/*",
    "*.pc",
]

sdist.exclude = [
    ".github",
    "csharp",
    "examples",
    "tests",
    "capi",
]
