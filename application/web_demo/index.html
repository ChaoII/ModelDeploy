<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelDeploy · 模型功能演示</title>
<style>
:root{
  --bg:#060913;--bg-2:#0a1024;--panel:#0f1730;--panel-2:#0b1123;
  --line:#1d2b4d;--line-glow:rgba(37,198,252,.35);
  --tx:#e6f0ff;--mut:#7d8db0;--acc:#25c6fc;--sec:#a855f7;
  --ok:#2be6a3;--warn:#ffcc00;--bad:#ff5470;
  --mono:Consolas,'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Segoe UI','Microsoft YaHei',sans-serif;color:var(--tx);
  background:var(--bg);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 900px 560px at 12% 6%,rgba(37,198,252,.10),transparent 60%),
    radial-gradient(ellipse 700px 480px at 90% 92%,rgba(168,85,247,.10),transparent 60%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%)}
header{position:relative;z-index:3;display:flex;align-items:center;gap:12px;height:52px;padding:0 18px;
  border-bottom:1px solid var(--line);background:rgba(10,18,38,.85);backdrop-filter:blur(8px)}
header h1{font-size:15px;margin:0;letter-spacing:.5px;font-weight:600}
header .sub{color:var(--mut);font-size:11px;margin-left:2px}
.sp{flex:1}
.pill{font-size:11px;padding:3px 11px;border-radius:20px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.on{color:var(--acc);border-color:var(--acc)}
.pill .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}

.layout{position:relative;z-index:1;display:flex;height:100%}

/* ── 左栏 ── */
nav{width:262px;flex-shrink:0;border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px;background:rgba(8,13,28,.6)}
nav .nav-t{font-size:10px;letter-spacing:1.5px;color:var(--mut);padding:2px 8px 8px;text-transform:uppercase}
.grp{color:var(--mut);font-size:11px;font-weight:600;margin:10px 6px 5px;letter-spacing:1px}
nav .m{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;margin:2px 0;
  border:1px solid transparent;border-radius:9px;cursor:pointer;transition:.12s}
nav .m:hover{background:#101b38;border-color:var(--line)}
nav .m.sel{border-color:var(--acc);background:linear-gradient(90deg,rgba(37,198,252,.12),transparent)}
nav .m .name{display:flex;align-items:center;gap:7px;font-weight:600}
nav .m .tag{font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(37,198,252,.12);color:var(--acc);letter-spacing:.5px}
nav .m .inf{font-size:10px;color:var(--mut);margin-top:2px}
.Status{display:inline-flex;align-items:center;gap:5px;flex-shrink:0;font-size:10px;padding:2px 8px;border-radius:10px}
.Status .d{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.Status.un .d{background:#54627f}
.Status.lo .d{border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;width:9px;height:9px;animation:spin .7s linear infinite;background:transparent}
.Status.rd{color:var(--ok)}
.Status.rd .d{background:var(--ok)}
.Status.fl{color:var(--bad)}
.Status.fl .d{background:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 右主区 ── */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);
  background:rgba(10,16,36,.55);flex-shrink:0}
.toolbar .cur{display:flex;align-items:center;gap:8px;min-width:0}
.toolbar #curName{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.tbtn{border:1px solid var(--line);background:rgba(15,23,48,.7);color:var(--tx);font-size:12px;
  padding:6px 13px;border-radius:8px;transition:.12s}
.tbtn:hover{border-color:var(--acc);color:var(--acc)}
.tbtn:disabled{opacity:.45;cursor:not-allowed}
.tbtn.primary{background:linear-gradient(90deg,rgba(37,198,252,.2),rgba(168,85,247,.18));border-color:var(--acc);color:#dff5ff;font-weight:600}
.tbtn.primary:disabled{border-color:var(--line);color:var(--mut);background:rgba(15,23,48,.7)}

.samp-wrap{position:relative}
.samp-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:180px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5);overflow:hidden}
.samp-menu.open{display:block}
.samp-menu .it{padding:9px 14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:9px}
.samp-menu .it:hover{background:rgba(37,198,252,.08);color:var(--acc)}
.samp-menu .it img{width:34px;height:34px;object-fit:cover;border-radius:5px;background:#000;border:1px solid var(--line)}

.stagewrap{flex:1;min-height:0;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;align-items:center;gap:8px}
#emptyHint{color:var(--mut);font-size:13px;margin:auto;text-align:center;line-height:1.8}
#emptyHint b{color:var(--acc)}
#wrap{position:relative;max-width:100%;display:none;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden}
#img{max-width:100%;max-height:70vh;display:block;object-fit:contain}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

/* ── 结果面板 ── */
.results{flex-shrink:0;max-height:44%;display:flex;flex-direction:column;overflow:hidden;
  border-top:1px solid var(--line);background:rgba(9,14,30,.7)}
.results .tabs{display:flex;align-items:center;gap:6px;padding:8px 12px;flex-shrink:0;border-bottom:1px solid transparent}
.tabbtn{background:none;border:none;color:var(--mut);font-size:12px;font-weight:600;padding:5px 12px;border-radius:7px}
.tabbtn:hover{color:var(--tx)}
.tabbtn.on{color:var(--acc);background:rgba(37,198,252,.1)}
.results .fold{margin-left:8px;background:none;border:1px solid var(--line);color:var(--mut);font-size:11px;padding:3px 9px;border-radius:6px}
.results .fold:hover{color:var(--acc);border-color:var(--acc)}
.res-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.tabpane{display:none;padding:12px 14px}
.tabpane.on{display:block}
.results.collapsed .res-body{display:none}
.results.collapsed{max-height:42px}
#viznote{font-size:12px;color:var(--mut);margin-bottom:10px}
#viznote b{color:var(--tx)}
#dlPng{margin-left:auto;border:1px solid var(--acc);background:rgba(37,198,252,.12);color:var(--acc);font-size:12px;padding:5px 12px;border-radius:7px}
#dlPng:hover{background:rgba(37,198,252,.2)}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{border:1px solid var(--line);padding:5px 9px;text-align:left}
th{color:var(--acc);background:rgba(37,198,252,.06)}
pre{background:#070d1c;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;
  font-family:var(--mono);font-size:11px;max-height:300px;margin:0}
#json{white-space:pre-wrap;word-break:break-all}
.mut{color:var(--mut)}
.empty{color:var(--mut);font-size:12px}

/* ── 遮罩与 toast ── */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(4,7,15,.62);backdrop-filter:blur(2px)}
.modal.on{display:flex}
.modal .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 34px;
  text-align:center;min-width:250px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.modal .spinner{width:34px;height:34px;margin:0 auto 14px;border:3px solid var(--line);border-top-color:var(--acc);
  border-radius:50%;animation:spin .8s linear infinite}
.modal .txt{font-size:14px;font-weight:600}
.modal .err{color:var(--bad);font-size:13px;margin-top:8px;white-space:pre-wrap;max-width:420px}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--panel);border:1px solid var(--line);color:var(--tx);font-size:13px;
  padding:9px 16px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:80vw;animation:pop .15s ease}
.toast.err{border-color:var(--bad);color:#ffd7dd}
.toast.ok{border-color:var(--ok);color:#d3fff9}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <h1>ModelDeploy<span class="sub">模型功能演示 · 懒加载</span></h1>
  <div class="sp"></div>
  <span id="ctxPill" class="pill">未选择模型</span>
  <span id="cnt" class="pill">0 模型</span>
</header>
<div class="layout">
  <nav>
    <div class="nav-t">模型列表</div>
    <div id="nav"></div>
  </nav>
  <main>
    <div class="toolbar">
      <div class="cur">
        <span id="curName" class="mut">未选择模型</span>
        <span id="curSt" class="Status un"><span class="d"></span><span class="t">未选择</span></span>
      </div>
      <div class="sp"></div>
      <button id="uploadBtn" class="tbtn">上传图片</button>
      <div class="samp-wrap">
        <button id="sampleBtn" class="tbtn">样例图 ▾</button>
        <div class="samp-menu" id="sampMenu"></div>
      </div>
      <button id="runBtn" class="tbtn primary">推理</button>
    </div>

    <div class="stagewrap">
      <div id="emptyHint">选择左侧模型并<b>解锁</b>后，<br>上传图片或选取样例即可推理。</div>
      <div id="wrap">
        <img id="img" alt="input preview">
        <canvas id="cv"></canvas>
      </div>
    </div>

    <div class="results" id="results">
      <div class="tabs">
        <button class="tabbtn on" data-tab="viz">可视化</button>
        <button class="tabbtn" data-tab="json">JSON</button>
        <button id="dlPng">下载 PNG</button>
        <div class="sp"></div>
        <button class="fold" id="foldBtn">收起 ▲</button>
      </div>
      <div class="res-body">
        <div class="tabpane on" id="tab-viz">
          <div id="viznote"></div>
          <div id="table"></div>
        </div>
        <div class="tabpane" id="tab-json">
          <pre id="json"></pre>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="card">
    <div class="spinner"></div>
    <div class="txt" id="mText">加载中…</div>
    <div class="err" id="mErr" style="display:none"></div>
  </div>
</div>
<div id="toasts"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
let models=[], selId=null, curB64=null, cv=null, ctx=null;

const PALETTE=['#25c6fc','#a855f7','#2be6a3','#ffcc00','#ff5470','#ff8c42','#7cff5c','#5cb8ff','#f26dff','#4deaea'];
const colorOf=i=>PALETTE[((i%PALETTE.length)+PALETTE.length)%PALETTE.length];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function hexRgba(h,a){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255,Math.round(a*255)];}
function fmt(v){if(typeof v==='number')return (Math.round(v*1000)/1000).toString();return v==null?'':String(v);}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TYPE_ICONS={det:'DT',face:'FC',seg:'SEG',pose:'PS',obb:'OB',ocr:'OCR',lpr:'LPR',cls:'CLS',sem:'SEM',depth:'DP'};
const typeIcon=t=>TYPE_ICONS[t]||String(t||'?').toUpperCase().slice(0,3);
const GROUP_LABELS={det:'检测',cls:'分类',seg:'实例分割',pose:'姿态',obb:'OBB',sem:'语义分割',depth:'深度',ocr:'OCR',face:'人脸',lpr:'车牌'};

/* ── API ── */
async function apiGet(u){const r=await fetch(u);const j=await r.json().catch(()=>({}));if(!r.ok)throw(j.error||new Error('HTTP '+r.status));return j;}
async function apiPost(u,b){
  const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw (j.error?Object.assign(new Error(j.error.message||j.error.code),{json:j}):new Error('HTTP '+r.status));
  return j;
}

/* ── toast / modal ── */
function toast(msg,kind){
  const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;
  $('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320);},2600);
}
function showModal(text){$('mText').textContent=text;$('mErr').style.display='none';$('modal').classList.add('on');}
function hideModal(){$('modal').classList.remove('on');}
function modalFail(text){$('mText').style.display='none';const e=$('mErr');e.style.display='block';e.textContent=text;}

/* ── 列表渲染 ── */
function statusOf(m){return m.status==='loading'?'lo':(m.status==='ready'?'rd':(m.status==='failed'?'fl':'un'));}
function statusTxt(m){
  if(m.status==='loading')return '加载中';
  if(m.status==='ready')return '就绪';
  if(m.status==='failed')return '失败';
  return '未加载';
}
function renderNav(){
  const n=$('nav');n.innerHTML='';
  if(!models.length){const e=document.createElement('div');e.className='empty';e.textContent='无可用模型';n.appendChild(e);return;}
  const groups={};
  models.forEach(m=>{(groups[m.type]=groups[m.type]||[]).push(m);});
  let first=true;
  Object.keys(groups).forEach(type=>{
    const g=document.createElement('div');
    g.className='grp';g.style.marginTop=first?'0':'10px';first=false;
    g.textContent=GROUP_LABELS[type]||type.toUpperCase();
    n.appendChild(g);
    groups[type].forEach(m=>{
      const d=document.createElement('div');
      d.className='m'+(m.id===selId?' sel':'');
      d.onclick=()=>select(m.id);
      const input=(m.input_size||[]).map(v=>String(v)).join(' × ')||'—';
      d.innerHTML=`<div>
          <div class="name"><span class="tag">${esc(typeIcon(m.type))}</span>${esc(m.display)}</div>
          <div class="inf">${esc(input)}</div>
        </div>
        <span class="Status ${statusOf(m)}"><span class="d"></span><span class="t">${statusTxt(m)}</span></span>`;
      n.appendChild(d);
    });
  });
}
function curModel(){return models.find(m=>m.id===selId)||null;}
function updateHeader(m){
  const p=$('ctxPill');
  if(!m){p.className='pill';p.textContent='未选择模型';return;}
  const st=m.status==='ready'?'ok':(m.status==='failed'?'bad':'on');
  p.className='pill '+st;
  p.innerHTML='<span class="d"></span>'+esc(m.display)+' · '+statusTxt(m);
}
function updateToolbar(m){
  const st=$('curSt');
  if(!m){$('curName').className='mut';$('curName').textContent='未选择模型';st.className='Status un';st.innerHTML='<span class="d"></span><span class="t">未选择</span>';}
  else{$('curName').className='';$('curName').textContent=m.display;st.className='Status '+statusOf(m);st.innerHTML='<span class="d"></span><span class="t">'+statusTxt(m)+'</span>';}
  $('runBtn').disabled=!(m&&m.status==='ready');
}
async function refresh(){
  try{models=(await apiGet('/v1/models')).models||[];}catch(e){models=[];}
  $('cnt').textContent=models.length+' 模型';
  const m=curModel();
  renderNav();
  updateHeader(m);
  updateToolbar(curModel());
}

/* ── 选中 / 加载 ── */
let selectGen=0;
async function select(id){
  const gen=++selectGen;
  selId=id;
  renderNav();
  updateToolbar(curModel());
  const m=curModel();
  if(m&&m.status==='ready'){if(gen===selectGen)toast('模型已就绪','ok');return;}
  if(!m)return;
  if(gen===selectGen)showModal('加载「'+m.display+'」…');
  if(m.status!=='loading'&&m.status!=='ready'){
    try{await apiPost('/v1/models/'+encodeURIComponent(id)+'/load');}catch(e){if(gen===selectGen){hideModal();toast('加载请求失败：'+(e.message||e),'err');}return;}
  }
  const deadline=Date.now()+120000;
  let gone=false;
  while(Date.now()<deadline){
    await sleep(500);
    await refresh();
    const cur=curModel();
    if(!cur){gone=true;break;}
    if(cur.status==='ready'){
      if(gen===selectGen){hideModal();toast('模型已就绪，可以推理了','ok');}
      return;
    }
    if(cur.status==='failed'){
      if(gen===selectGen){hideModal();toast('模型加载失败：'+(cur.error||'未知错误'),'err');}
      return;
    }
    if(cur.status==='loading'&&gen===selectGen)showModal('加载「'+cur.display+'」…');
  }
  if(gen===selectGen){hideModal();toast(gone?'模型不存在':'加载超时，请重试','err');}
}

/* ── 图片处理（长边≤1600 降采样）── */
function fileToImage(f){return new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>ok(im);im.onerror=er;im.src=r.result;};r.onerror=er;r.readAsDataURL(f);});}
function downscaled(img,max){
  let w=img.naturalWidth,h=img.naturalHeight;
  const mm=Math.max(w,h);
  if(mm>max){const k=max/mm;w=Math.round(w*k);h=Math.round(h*k);}
  const off=document.createElement('canvas');off.width=w;off.height=h;
  off.getContext('2d').drawImage(img,0,0,w,h);
  return {w,h,dataUrl:off.toDataURL('image/jpeg',0.9)};
}
function setPreview(info){
  const img=$('img');img.src=info.dataUrl;
  $('wrap').style.display='block';
  $('emptyHint').style.display='none';
  cv=$('cv');cv.width=info.w;cv.height=info.h;
  ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);
  curB64=info.dataUrl.split(',')[1];
  clearResult();
}
function clearResult(){
  $('viznote').innerHTML='';
  $('table').innerHTML='<span class="empty">等待推理结果…</span>';
  $('json').textContent='';
}
async function loadFromImage(img,type){
  try{setPreview(downscaled(img,1600));toast('图片已加载','ok');}
  catch(e){toast('图片解码失败','err');}
}
async function uploadFile(f){
  if(!f)return;
  const okType=/^image\//.test(f.type||'')||/\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name||'');
  if(!okType){toast('请选择图片文件（JPG/PNG 等）','err');return;}
  try{loadFromImage(await fileToImage(f),f.type||'image/jpeg');}
  catch(e){toast('图片解码失败','err');}
}
function chooseSample(name){
  const im=new Image();
  im.onload=()=>loadFromImage(im,'image/png');
  im.onerror=()=>toast('样例图加载失败','err');
  im.src='./samples/'+name;
}

/* ── 推理 ── */
async function run(){
  const m=curModel();
  if(!m){toast('请先选择模型','err');return;}
  if(m.status!=='ready'){toast('请等待模型加载完成','err');return;}
  if(!curB64){toast('请先上传或选择样例图片','err');return;}
  const t0=performance.now();
  $('runBtn').disabled=true;
  try{
    const r=await apiPost('/v1/models/'+encodeURIComponent(m.id)+'/infer',{image:curB64});
    const dt=performance.now()-t0;
    renderResult(m,r.results);
    $('viznote').innerHTML=esc(m.display)+' · 服务端 <b>'+fmt(r.duration_ms)+' ms</b> · 浏览器总耗时 '+dt.toFixed(0)+' ms';
    $('json').textContent=JSON.stringify(r,null,2);
    showTab('viz');
    toast('推理完成','ok');
  }catch(e){
    toast('推理失败：'+(e.message||e),'err');
  }finally{$('runBtn').disabled=!(m.status==='ready');}
}

/* ════════════ 各类型渲染（沿用既有实现，坐标=输入图绝对像素） ════════════ */
function renderResult(m,res){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(res==null){renderTable([],true);return;}
  const labels=(m&&m.labels)||[];
  const arr=Array.isArray(res)?res:(res&&res.results?res.results:null);

  if(m.type==='cls'){clsTopN(res);return;}

  if(m.type==='ocr'&&res.boxes){ocrBoxes(res.boxes,res.text,res.rec_scores);renderOcrTable(res);return;}
  if(m.type==='sem'&&res.shape&&res.labels){semOverlay(res);return;}
  if(m.type==='depth'&&res.shape&&res.depth){depthOverlay(res);return;}
  if(m.type==='face'&&res.embedding){tableEmbedding(res);return;}

  if(!arr){renderTable([],true);return;}

  arr.forEach((r,i)=>{
    const box=r.box||r.rotated_box;
    const labelName=(labels.length?labels[+r.label_id]:null)||('id'+r.label_id);
    const score=r.score!=null?(' '+Number(r.score).toFixed(2)):'';
    const caption=[labelName,score].join('').trim();
    if(m.type==='lpr'){
      const colorMap={blue:'#2563eb',green:'#22c55e',yellow:'#ffcc00',white:'#e5e7eb',black:'#000000'};
      const c=colorMap[((r.car_plate_color||'')+'').toLowerCase()]||'#25c6fc';
      if(r.box) rect(r.box,c,r.car_plate_str||'车牌');
      return;
    }
    if(m.type==='obb'){
      if(r.rotated_box) rotated(r.rotated_box,colorOf(i),caption);
    }else if(m.type==='pose'){
      if(r.box) rect(r.box,'#25c6fc',caption);
      if(Array.isArray(r.keypoints)) poseSkeleton(r.keypoints,colorOf(i));
    }else{
      if(r.box) rect(r.box,colorOf(i),caption);
      if(m.type==='seg'&&r.mask) maskOverlay(r.mask,colorOf(i));
    }
  });
  renderTable(arr);
}
function rect(b,c,txt){
  if(!b)return;
  ctx.strokeStyle=c;ctx.lineWidth=2;ctx.strokeRect(b.x,b.y,b.width,b.height);
  if(txt){ctx.font='12px system-ui';ctx.fillStyle=c;const tw=ctx.measureText(txt).width+8;
    const yy=b.y>16?b.y-17:Math.max(0,b.y+b.height+2);
    ctx.fillRect(b.x,yy,tw,15);ctx.fillStyle='#000';ctx.fillText(txt,b.x+4,yy+11);}
}
function dot(p,r){ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle='#25c6fc';ctx.fill();}
function poseSkeleton(kps,c){
  const LIMBS=[[0,1],[0,2],[1,3],[2,4],[5,7],[7,9],[6,8],[8,10],[5,6],[5,11],[6,12],[11,12],[11,13],[12,14],[13,15],[14,16]];
  ctx.strokeStyle=c;ctx.lineWidth=2;
  LIMBS.forEach(([a,b])=>{
    const A=kps[a],B=kps[b];
    if(A&&B&&A.x!=null&&B.x!=null){ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();}
  });
  kps.forEach((p,i)=>{if(p&&p.x!=null)dot(p,i<5?5:3);});
}
function rotated(o,c,txt){
  const rad=o.angle*Math.PI/180,cx=o.xc,cy=o.yc,cw=o.width/2,ch=o.height/2;
  const pts=[[-cw,-ch],[cw,-ch],[cw,ch],[-cw,ch]].map(p=>[cx+p[0]*Math.cos(rad)-p[1]*Math.sin(rad),cy+p[0]*Math.sin(rad)+p[1]*Math.cos(rad)]);
  ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.stroke();
  if(txt){ctx.font='12px system-ui';ctx.fillStyle=c;ctx.fillText(txt,pts[0][0],Math.max(0,pts[0][1]-4));}
}
function maskOverlay(m,c){
  const s=m.shape;if(!Array.isArray(s)||!Array.isArray(m.data))return;
  const h=s[0],w=s[1];if(!h||!w)return;
  const [cr,cg,cb]=hexRgba(c,255);
  const id=ctx.createImageData(w,h),d=m.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const v=d[y*w+x],k=(y*w+x)*4;
    if(v){id.data[k]=cr;id.data[k+1]=cg;id.data[k+2]=cb;id.data[k+3]=110;}
  }
  ctx.globalAlpha=0.5;ctx.putImageData(id,0,0);ctx.globalAlpha=1;
}
function ocrBoxes(boxes,text,rec_scores){
  boxes.forEach((b,i)=>{
    if(!Array.isArray(b))return;
    if(b.length===8){
      const pts=[[b[0],b[1]],[b[2],b[3]],[b[4],b[5]],[b[6],b[7]]];
      const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
      ctx.strokeStyle='#25c6fc';ctx.lineWidth=2;ctx.beginPath();
      pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.stroke();
      const x=Math.min(...xs),y=Math.min(...ys);
      const caption=(text&&text[i]?text[i]:'')+(rec_scores&&rec_scores[i]!=null?(' '+Number(rec_scores[i]).toFixed(2)):'');
      if(caption){ctx.font='12px system-ui';ctx.fillStyle='#25c6fc';
        const tw=ctx.measureText(caption).width+8,yy=y>16?y-17:y;
        ctx.fillRect(x,yy,tw,15);ctx.fillStyle='#000';ctx.fillText(caption,x+4,yy+11);}
    }else if(b.length===4){
      rect({x:b[0],y:b[1],width:b[2],height:b[3]},'#25c6fc',(text&&text[i])||'');
    }
  });
}
function semOverlay(res){
  const s=res.shape,[h,w]=[s[0],s[1]];if(!h||!w)return;
  const id=ctx.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const c=res.labels[y*w+x];const k=(y*w+x)*4;
    if(c){const[cr,cg,cb]=hexRgba(colorOf(c),255);id.data[k]=cr;id.data[k+1]=cg;id.data[k+2]=cb;id.data[k+3]=150;}
  }
  ctx.globalAlpha=0.55;ctx.putImageData(id,0,0);ctx.globalAlpha=1;
  renderSemTable(res);
}
function depthOverlay(res){
  const s=res.shape,[h,w]=[s[0],s[1]];const d=res.depth;
  if(!h||!w||!Array.isArray(d))return;
  let mn=Infinity,mx=-Infinity;for(const v of d){if(v<mn)mn=v;if(v>mx)mx=v;}
  const rng=(mx-mn)||1;
  const id=ctx.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const v=(d[y*w+x]-mn)/rng,k=(y*w+x)*4;
    id.data[k]=Math.round(v*255);id.data[k+1]=Math.round(v*120);id.data[k+2]=Math.round((1-v)*255);id.data[k+3]=160;
  }
  ctx.globalAlpha=0.6;ctx.putImageData(id,0,0);ctx.globalAlpha=1;
  renderDepthTable(res);
}
function clsTopN(res){
  const scores=res.scores||[],ids=res.label_ids||[],labels=(curModel()&&curModel().labels)||[];
  const rows=scores.map((s,i)=>({s,i,name:(labels.length?labels[ids[i]]:null)||('id'+(ids[i]!=null?ids[i]:i))}))
    .sort((a,b)=>b.s-a.s).slice(0,10);
  const t=$('table');
  if(!rows.length){t.innerHTML='<span class="empty">无结果</span>';return;}
  let html='<table><tr><th>#</th><th>label</th><th>score</th></tr>';
  rows.forEach((x,i)=>{html+=`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.s.toFixed(4)}</td></tr>`;});
  t.innerHTML=html+'</table>';
}
function tableEmbedding(res){
  const dim=Array.isArray(res.embedding)?res.embedding.length:(Array.isArray(res.feature)?res.feature.length:0);
  const t=$('table');t.innerHTML=`<table><tr><th>字段</th><th>值</th></tr>
    <tr><td>embedding 维度</td><td>${esc(fmt(dim))}</td></tr></table>`;
}
function renderTable(arr){
  const t=$('table');
  if(!arr||!arr.length){t.innerHTML='<span class="empty">无对象</span>';return;}
  const skip=new Set(['mask','keypoints','data','feature','embedding','table_html','table_structure']);
  const cols=[...new Set(arr.flatMap(o=>Object.keys(o)))].filter(k=>!skip.has(k));
  if(!cols.length){t.innerHTML='<span class="empty">无可展示字段</span>';return;}
  let html='<table><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
  arr.forEach(o=>{html+='<tr>'+cols.map(c=>'<td>'+(o[c]==null?'':esc(typeof o[c]==='object'?JSON.stringify(o[c]):fmt(o[c])))+'</td>').join('')+'</tr>';});
  t.innerHTML=html+'</table>';
}
function renderOcrTable(res){
  const t=$('table');
  const n=(res.boxes||[]).length;
  if(!n){t.innerHTML='<span class="empty">无文本</span>';return;}
  let html='<table><tr><th>#</th><th>文本</th><th>识别分</th></tr>';
  for(let i=0;i<n;i++){html+=`<tr><td>${i+1}</td><td>${esc(res.text&&res.text[i])}</td><td>${res.rec_scores&&res.rec_scores[i]!=null?fmt(res.rec_scores[i]):'—'}</td></tr>`;}
  t.innerHTML=html+'</table>';
}
function renderSemTable(r){
  const t=$('table');
  t.innerHTML=`<table><tr><th>字段</th><th>值</th></tr>
    <tr><td>shape (H×W)</td><td>${esc((r.shape||[]).join(' × '))}</td></tr>
    <tr><td>num_classes</td><td>${esc(fmt(r.num_classes))}</td></tr></table>`;
}
function renderDepthTable(r){
  const t=$('table');
  t.innerHTML=`<table><tr><th>字段</th><th>值</th></tr>
    <tr><td>shape (H×W)</td><td>${esc((r.shape||[]).join(' × '))}</td></tr>
    <tr><td>像素数</td><td>${esc(fmt((r.depth||[]).length))}</td></tr></table>`;
}

/* ════════════ 交互装配 ════════════ */
const SAMPLES=[['scene.png','场景图'],['gradient.png','渐变图'],['plate.png','车牌']];
function buildSamples(){
  const menu=$('sampMenu');
  SAMPLES.forEach(([name,label])=>{
    const it=document.createElement('div');it.className='it';
    it.innerHTML='<img src="./samples/'+name+'" alt="">'+esc(label);
    it.onclick=()=>{closeSampleMenu();chooseSample(name);};
    menu.appendChild(it);
  });
  $('sampleBtn').onclick=e=>{e.stopPropagation();menu.classList.toggle('open');};
  document.addEventListener('click',closeSampleMenu);
}
function closeSampleMenu(){$('sampMenu').classList.remove('open');}

$('uploadBtn').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>i.files[0]&&uploadFile(i.files[0]);i.click();};
$('runBtn').onclick=run;

function showTab(name){
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('on',p.id==='tab-'+name));
}
document.querySelectorAll('.tabbtn').forEach(b=>{
  b.onclick=()=>{showTab(b.dataset.tab);const w=$('results');w.classList.remove('collapsed');w.style.maxHeight='44%';$('foldBtn').textContent='收起 ▲';};
});
$('foldBtn').onclick=()=>{
  const w=$('results');const c=w.classList.toggle('collapsed');
  if(c){w.style.maxHeight='';$('foldBtn').textContent='展开 ▼';}
  else{w.style.maxHeight='44%';$('foldBtn').textContent='收起 ▲';}
};
$('dlPng').onclick=()=>{
  if(!curB64||$('wrap').style.display==='none'){toast('暂无可下载的可视化结果','err');return;}
  const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;
  const g=c.getContext('2d');
  g.drawImage($('img'),0,0,c.width,c.height);
  g.drawImage(cv,0,0);
  const a=document.createElement('a');a.download='visual.png';a.href=c.toDataURL('image/png');a.click();
};

buildSamples();
setInterval(refresh,5000);
refresh();
